name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Principio de mínimo privilegio: el workflow solo lee el repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que la imagen de producción (backend/Dockerfile).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx pip-audit

      - name: Dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          RATE_LIMIT_ENABLED: "false"
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Dependency audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  sast:
    name: SAST (bandit + semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit (reglas de seguridad Python)
        working-directory: backend
        run: |
          pip install bandit
          bandit -r app/ -ll --quiet

      - name: Semgrep OSS (patrones de seguridad auto/configurables)
        working-directory: backend
        run: |
          pip install semgrep
          semgrep scan --config auto --error --exclude tests/ --metrics off

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo
      - uses: gitleaks/gitleaks-action@v3

  dependency-review:
    name: Dependency review (PRs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container-scan:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t hubzy-backend:ci backend/
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hubzy-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "0" # informativo por ahora; subir a "1" cuando esté en verde

      - name: SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0.17.8
        with:
          image: hubzy-backend:ci
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom-backend.spdx.json
          retention-days: 30
