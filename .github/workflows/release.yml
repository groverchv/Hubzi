name: Release (build + sign image)

# Se ejecuta al publicar un tag v* — construye la imagen, genera SBOM y la
# firma con cosign keyless (OIDC de GitHub → Fulcio). Requiere registry:
#   Settings → Variables → REGISTRY=ghcr.io/tu-org  (o DOCKERHUB_NAMESPACE)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC para firma keyless de cosign

jobs:
  build-sign:
    name: Build, SBOM y firma cosign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login al registry (GHCR por defecto)
        if: vars.REGISTRY == '' || startsWith(vars.REGISTRY, 'ghcr.io')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t hubzy-backend:${{ github.ref_name }} backend/

      - name: SBOM de la imagen release
        uses: anchore/sbom-action@v0.17.8
        with:
          image: hubzy-backend:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-${{ github.ref_name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom-${{ github.ref_name }}.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Firma keyless: la identidad queda ligada al workflow OIDC de GitHub
      # (registro público en Rekor — verificable con `cosign verify`).
      - name: Sign image (solo si hay registry configurado)
        if: vars.REGISTRY != ''
        run: |
          IMAGE="${{ vars.REGISTRY }}/hubzy-backend:${{ github.ref_name }}"
          docker tag hubzy-backend:${{ github.ref_name }} "$IMAGE"
          docker push "$IMAGE"
          cosign sign --yes "$IMAGE"
