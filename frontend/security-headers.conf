# Security headers OWASP para el contenido estático (SPA).
# Se incluye con `include` desde nginx.conf en el server y en /assets/
# (un add_header propio en un location anula la herencia del server).
# /api/ y /ws/ NO lo incluyen: el backend ya envía sus propios headers
# (main.py security_headers middleware) y duplicarlos sería contradictorio.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# microphone=(self): la app usa SpeechRecognition del navegador.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

# CSP de la SPA:
#  - script-src 'self': el bundle de Vite es externo; posthog-js puede cargar
#    sub-recursos (recorder/surveys) desde su CDN propio.
#  - style-src 'unsafe-inline': React genera atributos style= en caliente.
#  - connect-src: API same-origin + PostHog (analytics) + Sentry (errores).
#  - media/blob: audio TTS servido como Blob URL; img/data+blob: assets
#    generados y data URIs embebidas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.posthog.com https://*.sentry.io; media-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
