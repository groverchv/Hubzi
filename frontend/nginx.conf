server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Headers OWASP para el contenido estático (ver security-headers.conf).
    # /api/ y /ws/ no los llevan: el backend emite los suyos propios.
    include /etc/nginx/security-headers.conf;

    # Archivos estáticos con hash de Vite: caché agresiva e inmutable.
    location /assets/ {
        expires 1y;
        # Este add_header anula la herencia de headers del server → re-incluir.
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # API → backend (mismo origen: el frontend usa rutas relativas /api/v1/...).
    # Generar tableros con LLM puede tardar minutos: timeouts holgados.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 30m;
    }

    # RFC 9116 — canal de divulgación de vulnerabilidades.
    location = /.well-known/security.txt {
        alias /usr/share/nginx/html/.well-known/security.txt;
        default_type text/plain;
    }

    # SPA fallback: cualquier ruta no-asset resuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
