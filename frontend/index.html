<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- SEO & Educación Inclusiva -->
    <title>Hubzi — Santuario de Aprendizaje Zen & EdTech Inclusivo</title>
    <meta name="description" content="Hubzi transforma tus apuntes y documentos en un juego de aventura cognitiva mientras cuida tu calma mental. Plataforma EdTech gamificada con accesibilidad universal, modo zen y apoyo para diversidad cognitiva." />
    <meta name="keywords" content="Hubzi, EdTech, aprendizaje adaptativo, gamificación educativa, capibara, modo zen, accesibilidad, TDAH, dislexia, estudio sin estrés" />
    <meta name="author" content="Hubzi EdTech" />

    <!-- Metadatos de Accesibilidad e Inclusión (A11y & Screen Readers) -->
    <meta name="accessibility" content="screenReaderFriendly, highContrast, tactileVisuals, audioNarrated, cognitiveAccessibility" />
    <meta name="accessibility-feature" content="alternativeText" />
    <meta name="accessibility-feature" content="readingOrder" />
    <meta name="accessibility-feature" content="structuralNavigation" />
    <meta name="accessibility-feature" content="highContrastAudio" />
    <meta name="accessibility-hazard" content="noFlashingHazard" />
    <meta name="educational-use" content="Self-Study, Active Recall, Gamified Learning, Stress Management" />
    <meta name="educational-audience" content="Students, Teachers, Neurodivergent Learners, Lifelong Learners" />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hubzi" />
    <meta property="og:title" content="Hubzi — Tus apuntes se convierten en un juego" />
    <meta property="og:description" content="Aprende jugando con Hubzi, tu compañera capibara. Gamificación táctil, arenas de memorización activa y modo zen para reducir la ansiedad ante exámenes." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:image:alt" content="Hubzi, la tierna capibara estudiante con mochila y cuaderno, lista para acompañarte en tu estudio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hubzi — Santuario de Aprendizaje Zen" />
    <meta name="twitter:description" content="Estudia jugando, respira aprendiendo con Hubzi." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Google Fonts: Fredoka & Nunito (Títulos y badges), Plus Jakarta Sans (Cuerpo y notas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD para Plataforma Educativa Accesible -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Hubzi",
      "alternateName": "Hubzi Santuario de Aprendizaje",
      "url": "https://hubzi.app",
      "description": "Plataforma EdTech gamificada que convierte apuntes en mapas de aventura interactivos con Hubzi la capibara, integrando bienestar mental y memorización activa.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All modern browsers, mobile responsive",
      "inLanguage": ["es", "en", "pt"],
      "accessibilityFeature": [
        "alternativeText",
        "audioDescription",
        "highContrastDisplay",
        "readingOrder",
        "structuralNavigation",
        "speechSynthesis",
        "reducedMotion"
      ],
      "accessibilityHazard": "none",
      "accessibilitySummary": "Diseñado para inclusión universal con paleta de bajo estrés visual (Santuario Capibara), fuentes legibles para dislexia, descripciones detalladas de imágenes para lectores de pantalla, síntesis de voz opcional y controles de calma mental.",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      }
    }
    </script>

    <script src="/install-prompt.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
